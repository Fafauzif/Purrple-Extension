<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purrple · Pose fitting</title>
<style>@font-face{font-family:Nunito;src:url('../extension/assets/fonts/NunitoSans.ttf')}body{margin:24px;background:#f6f0fa;color:#51375f;font:16px Nunito,system-ui}label{display:inline-block;margin:8px}select,button,input{font:inherit;padding:7px;color:#51375f}button,select{cursor:pointer}canvas{display:block;background:#fff;border:1px solid #dbc8e9;max-width:100%;height:auto}#note{max-width:850px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ad78c0;outline-offset:2px}.controls{max-width:1000px}pre{font-size:12px;white-space:pre-wrap;max-width:1000px}a{color:#78508f}</style>
<h1>Purrple accessory fitting</h1><p id="note">Raw source poses and animated shape articulation use the shared runtime renderer. Every source row owns its real frame count and independent head/neck registration.</p><a href="../extension/animations.html">Open the motion studio</a>
<div class="controls"><label>Pose <select id="clip"></select></label><label>Source key <select id="key"></select></label><label>Head <select id="head"></select></label><label>Neck <select id="neck"></select></label><label><input id="debug" type="checkbox">Registration markers</label><label><input id="animated" type="checkbox">Animate shared renderer</label><button id="theme">Dark background</button></div>
<canvas id="view" width="800" height="600"></canvas><pre id="info"></pre>
<script src="../extension/js/renderer-data.js"></script><script src="../extension/js/renderer.js"></script><script>
const $=id=>document.getElementById(id);let dark=false,started=performance.now(),last=0;
for(const id of Object.keys(PurrpleArt.sprites))$('clip').add(new Option(id,id));
function keys(){const old=+$('key').value;$('key').replaceChildren();for(let i=0;i<PurrpleArt.sprites[$('clip').value].frames.length;i++)$('key').add(new Option(i+1,i));$('key').value=String(Math.min(old,PurrpleArt.sprites[$('clip').value].frames.length-1));}
keys();
for(const slot of ['head','neck']){$(slot).add(new Option('None',''));for(const [id,p]of Object.entries(PurrpleArt.items))if(p.slot===slot)$(slot).add(new Option(id,id));}
function render(o={}){const clip=o.clip||$('clip').value,key=o.key??Number($('key').value),head=o.head??$('head').value,neck=o.neck??$('neck').value,c=$('view'),ctx=c.getContext('2d');ctx.fillStyle=dark?'#282034':'#fffafc';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.translate(144,32);ctx.scale(2,2);ctx.imageSmoothingEnabled=false;PurrpleRenderer.drawFrame(ctx,clip,key,{head,neck});const lm=PurrpleRenderer.landmarkFor(clip,key);if(o.debug??$('debug').checked){ctx.fillStyle='#ea2868';for(const pt of [lm.eye,lm.neck]){ctx.beginPath();ctx.arc(...pt,3,0,Math.PI*2);ctx.fill();}ctx.strokeStyle='#ea2868';ctx.beginPath();ctx.moveTo(lm.eye[0]-lm.headWidth/2,lm.eye[1]);ctx.lineTo(lm.eye[0]+lm.headWidth/2,lm.eye[1]);ctx.stroke();}ctx.restore();$('info').textContent=JSON.stringify(lm,null,2);return lm;}
$('clip').onchange=()=>{keys();started=performance.now();render();};for(const id of ['key','head','neck','debug'])$(id).onchange=()=>render();$('theme').onclick=()=>{dark=!dark;render();};
function tick(now){if($('animated').checked&&now-last>1000/30){last=now;const c=$('view'),g=c.getContext('2d');g.fillStyle=dark?'#282034':'#fffafc';g.fillRect(0,0,800,600);PurrpleRenderer.draw(g,{clip:$('clip').value,time:(now-started)/1000,size:400,x:400,y:530,equipped:{head:$('head').value,neck:$('neck').value}});}requestAnimationFrame(tick);}
PurrpleRenderer.preload().then(()=>{render();window.PurrpleFit={render,ready:true};requestAnimationFrame(tick);});
</script></html>
